
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | ABREGU STUDIOS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0c0a0c;
            color: #f3e9d8;
            font-family: Arial, sans-serif;
        }

        .login {
            width: min(420px, 92%);
            padding: 32px;
            border: 1px solid #413138;
            border-radius: 16px;
            background: #191519;
        }

        h1 {
            margin: 0;
            font-size: 27px;
            letter-spacing: 1px;
        }

        .subtitulo {
            color: #d84c60;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #59424a;
            border-radius: 8px;
            background: #100e10;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #d43b54;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #mensaje {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <main class="login">

        <h1>ABREGU STUDIOS</h1>

        <p class="subtitulo">
            ACCESO ADMINISTRATIVO
        </p>

        <form id="form-login">

            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                autocomplete="username"
                required
            >

            <label for="contrasena">
                Contraseña
            </label>

            <input
                type="password"
                id="contrasena"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="entrar">
                INICIAR SESIÓN
            </button>

        </form>

        <p id="mensaje" role="status"></p>

        <button
            type="button"
            id="cerrar-sesion"
            hidden
        >
            Cerrar sesión
        </button>

    </main>

    <!-- BIBLIOTECA SUPABASE -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer>
    </script>

    <!-- NUESTRA CONEXIÓN -->
    <script
        src="../assets/js/supabase.js"
        defer>
    </script>

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const db = window.abreguDB;

                const form =
                    document.getElementById("form-login");

                const mensaje =
                    document.getElementById("mensaje");

                const entrar =
                    document.getElementById("entrar");

                const salir =
                    document.getElementById("cerrar-sesion");

                if (!db) {
                    mensaje.textContent =
                        "No se pudo cargar Supabase.";
                    return;
                }

                async function verificarAcceso() {

                    const {
                        data: { user },
                        error
                    } = await db.auth.getUser();

                    if (error || !user) {
                        return;
                    }

                    const estudio = await db
                        .from("estudios")
                        .select("nombre")
                        .eq("propietario_id", user.id)
                        .maybeSingle();

                    const miembro = await db
                        .from("miembros_estudio")
                        .select("rol,activo")
                        .eq("usuario_id", user.id)
                        .maybeSingle();

                    if (
                        estudio.error ||
                        miembro.error
                    ) {
                        mensaje.textContent =
                            "Sesión iniciada, pero ocurrió " +
                            "un error al consultar los permisos.";
                        return;
                    }

                    if (
                        estudio.data &&
                        miembro.data?.rol ===
                            "administrador" &&
                        miembro.data?.activo === true
                    ) {
                        mensaje.style.color = "#72d9a3";

                        mensaje.textContent =
                            "¡Acceso correcto! " +
                            "Administrador de " +
                            estudio.data.nombre;

                        form.hidden = true;
                        salir.hidden = false;
                        
window.location.href = "../index.html";


                    } else {
                        mensaje.textContent =
                            "La cuenta inició sesión, " +
                            "pero no tiene acceso administrador.";
                    }
                }

                form.addEventListener(
                    "submit",
                    async evento => {

                        evento.preventDefault();

                        entrar.disabled = true;

                        mensaje.textContent =
                            "Verificando credenciales...";

                        const correo =
                            document.getElementById("correo")
                                .value.trim();

                        const contrasena =
                            document.getElementById("contrasena")
                                .value;

                        const { error } =
                            await db.auth.signInWithPassword({
                                email: correo,
                                password: contrasena
                            });

                        entrar.disabled = false;

                        if (error) {
                            mensaje.style.color = "#ff7186";
                            mensaje.textContent =
                                "No se pudo iniciar sesión. " +
                                "Comprueba tus credenciales.";
                            return;
                        }

                        await verificarAcceso();
                    }
                );

                salir.addEventListener(
                    "click",
                    async () => {

                        await db.auth.signOut();

                        window.location.reload();
                    }
                );

                verificarAcceso();
            }
        );
    </script>

</body>
</html>
